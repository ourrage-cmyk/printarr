name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: sh -n scripts/entrypoint.sh scripts/smoke-test.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ourrage-cmyk/printarr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: printarr:ci
          build-args: VERSION=${{ github.sha }}
      - name: Smoke test the image
        run: |
          mkdir -p "$RUNNER_TEMP/data" && sudo chown 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name printarr-ci -p 8000:8000 \
            -e PRINTARR_PRINTER_MODE=file \
            -v "$RUNNER_TEMP/data:/data" printarr:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz >/dev/null 2>&1 && break; sleep 1; done
          sh scripts/smoke-test.sh http://localhost:8000
      - name: Show container logs
        if: always()
        run: docker logs printarr-ci || true
      - name: Build (amd64, arm64) and push on main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
