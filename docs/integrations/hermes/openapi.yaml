# OpenAPI tool definition for Hermes: the printarr operations Hermes may call.
# Subset of docs/openapi.json. Field names match app/slots.py and app/main.py on main.
#
# Status of each operation:
#   [live]     exists on main today
#   [gap]      works today, but a field Hermes needs is not accepted yet (see SKILL.md)

openapi: 3.1.0
info:
  title: printarr for Hermes
  version: 0.3.0
  description: >
    Send receipts to Yannic (yannic) or Allyson (wife), fill slot templates for briefings and notes,
    list and cancel tickets, read history, and pick briefing entities. No authentication; LAN only.
servers:
  - url: http://PRINTARR_URL/api/v1
paths:
  /slot-templates:
    get:
      operationId: listSlotTemplates
      summary: "[live] Slot templates: 101 Briefing, 102 Note. Fetch the schema before filling one."
      responses:
        "200": { description: Template ids, names and schema links. }

  /templates/{template_id}/schema:
    get:
      operationId: getSlotSchema
      summary: "[live] JSON Schema of a slot template's slots, with limits and descriptions"
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: integer, enum: [101, 102] } }
      responses:
        "200": { description: JSON Schema. }
        "404": { description: Not a slot template. }

  /tickets/slots:
    post:
      operationId: createSlotTicket
      summary: "[live] Queue a briefing or note from typed slots. Bad slots return 422 with each problem."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlotTicketCreate" }
      responses:
        "201": { description: The queued ticket. }
        "422": { description: "Slot problems, as a list of {slot, problem}." }

  /insights/entities:
    get:
      operationId: listInsightEntities
      summary: "[live] Numeric Home Assistant entities for a briefing, most notable first. Cached five minutes."
      parameters:
        - { name: person, in: query, required: true, schema: { $ref: "#/components/schemas/Recipient" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 12 } }
      responses:
        "200":
          description: Ranked candidates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InsightEntity" }
        "422": { description: Home Assistant is not configured. }

  /tickets:
    get:
      operationId: listTickets
      summary: "[live] Tickets, optionally by status or recipient"
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: recipient, in: query, schema: { $ref: "#/components/schemas/Recipient" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Tickets, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
    post:
      operationId: createTicket
      summary: "[live] Queue a plain text ticket. Supports hold, hold_key, send_at, idempotency_key and blocks."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreate" }
      responses:
        "201": { description: The queued ticket. A repeated idempotency_key returns the first ticket. }
        "422": { description: Invalid request, for example hold with send_at. }

  /tickets/{ticket_id}/cancel:
    post:
      operationId: cancelTicket
      summary: "[live] Cancel a pending ticket"
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The cancelled ticket. }

  /holds/{hold_key}/release:
    post:
      operationId: releaseHold
      summary: "[live] Release every held ticket with this key. Safe to repeat."
      parameters:
        - { name: hold_key, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Released tickets, or an empty list. }

  /log:
    get:
      operationId: readHistory
      summary: "[live] Past tickets with kind, tone, template and timings"
      parameters:
        - { name: recipient, in: query, schema: { $ref: "#/components/schemas/Recipient" } }
        - { name: since_hours, in: query, schema: { type: integer, minimum: 1 } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        "200": { description: Tickets, oldest first. }

components:
  schemas:
    Recipient:
      type: string
      enum: [yannic, wife]
      description: Yannic is yannic. Allyson is wife.
    Status:
      type: string
      enum: [held, pending, printing, sent, failed, cancelled]
    Kind:
      type: string
      enum: [morning, evening, note, shopping, todo, alert, fun, reminder]
    Tone:
      type: string
      enum: [loving, neutral, reminder, playful, gentle, firm, urgent]
    InsightEntity:
      type: object
      required: [entity_id, label, unit, current, mean_30d, z_score, trend, relevance, why]
      properties:
        entity_id: { type: string }
        label: { type: string }
        unit: { type: string }
        category: { type: string }
        owner: { type: [string, "null"], description: "yannic, wife, or null for shared house data." }
        current: { type: number }
        mean_30d: { type: number }
        stdev_30d: { type: number }
        z_score: { type: number, description: "Above 2 or below -2 is well outside the usual range." }
        trend: { type: string, enum: [up, down, flat] }
        trend_pct: { type: number }
        relevance: { type: integer, description: "3 own data, 1 shared house data." }
        score: { type: number }
        why: { type: string }
    Metric:
      type: object
      description: One number, drawn as a value and a graph. Give exactly one of entity_id, value or series.
      required: [label]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 20, description: "Short name, printed in capitals." }
        entity_id: { type: string, maxLength: 120, pattern: "^[a-z_]+\\.[a-z0-9_]+$" }
        value: { type: number, description: "A literal value, for data not in Home Assistant." }
        series: { type: array, maxItems: 48, items: { type: number }, description: "Literal history, oldest first. Its last value is shown." }
        unit: { type: string, maxLength: 8 }
        hours: { type: integer, minimum: 1, maximum: 168, description: "Hours of history to graph. Entities only." }
    BriefingSlots:
      type: object
      additionalProperties: false
      properties:
        greeting: { type: string, maxLength: 40, description: "Left out, printarr writes one from the time of day." }
        title: { type: string, maxLength: 60 }
        metrics: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/Metric" } }
        paragraph: { type: string, maxLength: 400, description: "The briefing text." }
        formatted: { type: boolean, default: true, description: "False when the text is raw speech to clean up." }
        tip: { type: string, maxLength: 120 }
    NoteSlots:
      type: object
      additionalProperties: false
      required: [paragraph]
      properties:
        title: { type: string, maxLength: 60 }
        paragraph: { type: string, minLength: 1, maxLength: 800 }
        tip: { type: string, maxLength: 120, description: "A closing line, such as a reminder." }
    SlotTicketCreate:
      type: object
      additionalProperties: false
      required: [template, recipient]
      properties:
        template: { type: integer, enum: [101, 102], description: "101 Briefing, 102 Note." }
        recipient: { $ref: "#/components/schemas/Recipient" }
        slots: { type: object, description: "Shape depends on template. See BriefingSlots and NoteSlots." }
        tone: { $ref: "#/components/schemas/Tone" }
        kind: { $ref: "#/components/schemas/Kind" }
        from_user: { $ref: "#/components/schemas/Recipient" }
        to_user: { $ref: "#/components/schemas/Recipient" }
        sender: { type: string, maxLength: 40, description: "Use hermes." }
        send_at: { type: string, format: date-time, description: "Local time without offset uses the server timezone. Omit to print when queued." }
    TicketCreate:
      type: object
      required: [recipient, message]
      additionalProperties: false
      properties:
        recipient: { $ref: "#/components/schemas/Recipient" }
        message: { type: string, maxLength: 2000 }
        template: { oneOf: [{ type: integer }, { const: auto }], default: auto }
        kind: { $ref: "#/components/schemas/Kind" }
        tone: { $ref: "#/components/schemas/Tone" }
        title: { type: string, maxLength: 80 }
        sender: { type: string, maxLength: 40 }
        from_user: { $ref: "#/components/schemas/Recipient" }
        to_user: { $ref: "#/components/schemas/Recipient" }
        blocks: { type: array, maxItems: 8, items: { type: object } }
        send_at: { type: string, format: date-time }
        hold: { type: boolean, default: false }
        hold_key: { type: string, maxLength: 40 }
        idempotency_key: { type: string, maxLength: 120 }
    Ticket:
      type: object
      properties:
        id: { type: string }
        recipient: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        kind: { type: string }
        tone: { type: string }
        message: { type: string }
        send_at: { type: string, format: date-time }
        printed_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
