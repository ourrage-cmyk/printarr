# Automations for printarr. Paste under automation: in configuration.yaml, or use the
# automations UI with "Edit in YAML". Replace PRINTARR_URL in rest_commands.yaml.
#
# Each person gets a strip, never a shared one. A briefing is created when its trigger fires,
# as on_release, and the person's pile is released straight after. Nothing is prepared ahead of
# time, so no stale briefings sit in a pile. A repeat trigger on the same day is harmless: the
# briefing key returns the ticket already printed, and the release prints only new items.

automation:
  # 1. Phone unplugged in the morning: that person's briefing and any messages waiting for them.
  - alias: "printarr: morning strip on phone unplug"
    id: printarr_morning_unplug
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.yannic_pixel_is_charging # CONFIRM
        from: "on"
        to: "off"
        id: yannic
      - platform: state
        entity_id: binary_sensor.allyson_pixel_is_charging # CONFIRM
        from: "on"
        to: "off"
        id: allyson
    condition:
      - condition: time
        after: "04:00:00"
        before: "11:00:00"
    action:
      - variables:
          person: "{{ 'yannic' if trigger.id == 'yannic' else 'wife' }}"
          day: "{{ now().date().isoformat() }}"
      - action: rest_command.printarr_create_slot_ticket
        data:
          template: 101
          recipient: "{{ person }}"
          kind: morning
          tone: neutral
          slots:
            title: "Morning"
          delivery: on_release
          idempotency_key: "morning:{{ person }}:{{ day }}"
          blocks:
            - { type: value, entity_id: "{{ 'sensor.body_battery_most_recent' if person == 'yannic' else 'sensor.body_battery_most_recent_2' }}", label: "Body battery", unit: "%" }
            - { type: value, entity_id: "{{ 'sensor.sleep_score' if person == 'yannic' else 'sensor.sleep_score_2' }}", label: "Sleep score", unit: "" }
        continue_on_error: true
      - action: rest_command.printarr_release_person
        data:
          person: "{{ person }}"
          trigger: morning
        continue_on_error: true

  # 2. Arriving home: that person's evening rundown and every message waiting for them. From 16:00.
  #    A second arrival the same day creates nothing new and prints only messages that arrived since.
  - alias: "printarr: evening strip on arriving home"
    id: printarr_evening_arrival
    mode: queued
    trigger:
      - platform: state
        entity_id: device_tracker.yannic_phone # CONFIRM
        to: home
        id: yannic
      - platform: state
        entity_id: device_tracker.allyson_phone # CONFIRM
        to: home
        id: allyson
    condition:
      - condition: time
        after: "16:00:00"
    action:
      - variables:
          person: "{{ 'yannic' if trigger.id == 'yannic' else 'wife' }}"
          day: "{{ now().date().isoformat() }}"
      - action: rest_command.printarr_create_slot_ticket
        data:
          template: 101
          recipient: "{{ person }}"
          kind: evening
          tone: neutral
          slots:
            title: "Evening"
          delivery: on_release
          idempotency_key: "evening:{{ person }}:{{ day }}"
          blocks:
            - { type: value, entity_id: sensor.home_temperature, label: "Home", unit: "°C" }
            - { type: value, entity_id: sensor.home_humidity, label: "Humidity", unit: "%" }
        continue_on_error: true
      - action: rest_command.printarr_release_person
        data:
          person: "{{ person }}"
          trigger: evening
        continue_on_error: true

  # 3. Notification to print: an action on a phone notification prints a standalone alert now.
  #    It is not merged into anyone's strip.
  - alias: "printarr: print notifications marked for paper"
    id: printarr_notification_to_print
    mode: queued
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: PRINTARR_PRINT
    action:
      - action: rest_command.printarr_create_ticket
        data:
          recipient: "{{ trigger.event.data.recipient | default('yannic') }}"
          kind: alert
          tone: "{{ trigger.event.data.tone | default('neutral') }}"
          title: "Alert"
          message: "{{ trigger.event.data.message }}"
          delivery: now
          sender: home-assistant
          idempotency_key: "alert:{{ trigger.event.data.recipient | default('yannic') }}:{{ trigger.event.data.message | md5 }}:{{ now().strftime('%Y-%m-%d-%H-%M') }}"
        continue_on_error: true
