# Printarr for TrueNAS. Apps > Install Custom App > paste this whole file.
#
# Change the two lines marked "<- change". Nothing else is needed.
# Everything printarr saves (tickets, settings, the decision model setup, backups) lives in the
# data folder below, so an upgrade or a rebuild of the app keeps it.
services:
  printarr:
    image: ghcr.io/ourrage-cmyk/printarr:latest   # pin to a sha-... tag to stay on one build
    restart: unless-stopped
    stop_grace_period: 30s                        # time allowed to finish a print on shutdown
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "8000:8000"                               # web page and API at http://<nas-ip>:8000/
    environment:
      PRINTARR_TIMEZONE: Europe/London
      PRINTARR_PRINTER_MODE: tcp
      PRINTARR_PRINTER_HOST: 192.168.1.50         # <- change: the printer's IP address
      PRINTARR_PRINTER_PORT: "9100"
      PRINTARR_PAPER_WIDTH: "42"
      # Decision model (Ollama on the LAN). Used on first start only. Afterwards change it in the
      # web page, where the change is saved in the data folder. Set LLM_ENABLED to "off" to use the
      # fixed rules only.
      PRINTARR_LLM_ENABLED: "on"
      PRINTARR_LLM_BASE_URL: http://192.0.2.231:11434/v1
      PRINTARR_LLM_MODEL: d1:latest
      PRINTARR_LLM_TEXT_MODEL: granite4.2:3b
      # Nightly backup into <data folder>/backups, at this local hour, keeping this many copies.
      PRINTARR_BACKUP_HOUR: "3"
      PRINTARR_BACKUP_KEEP: "7"
    volumes:
      # <- change if needed: a folder on your SSD dataset. Create it first, owned by uid 1000
      # (chown 1000:1000 /mnt/ssd/apps/printarr). The app refuses to start otherwise, and says so in the logs.
      - /mnt/ssd/apps/printarr:/data
